<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI価値ポジショニングマップ</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --ink:#e6e9ef; --sub:#9aa3b2;
    --accent:#6ea8fe; --cool:#5ad1b3; --warm:#ffb454; --hot:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    line-height:1.6;padding:32px 20px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--sub)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:14px;height:14px;border-radius:50%;display:inline-block}
  .sw-real{background:var(--accent)}
  .sw-idea{background:transparent;border:2px dashed var(--accent)}
  .sw-sweet{background:rgba(90,209,179,.25);border:1px solid var(--cool);border-radius:3px}
  h2{font-size:16px;margin:26px 0 8px;padding-left:9px;border-left:4px solid var(--accent)}
  .note{font-size:13.5px}
  .note b{color:var(--cool)}
  .small{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI価値ポジショニングマップ</h1>
  <p class="lead">射程（個人↔事業）× 向き（内向き↔外向き）の2軸に、現在の手札を配置した現在地マップ。（2026-06-25）</p>

  <div class="panel">
    <svg viewBox="0 0 800 620" role="img" aria-label="ポジショニングマップ">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L7,3 L0,6 Z" fill="#cdd3de"/>
        </marker>
      </defs>

      <!-- quadrant fills -->
      <!-- UL 個人×外向き = 狙い目 -->
      <rect x="70" y="55" width="330" height="255" fill="#5ad1b3" opacity="0.08"/>
      <!-- LR 事業×内向き = 狙い目 -->
      <rect x="400" y="310" width="330" height="255" fill="#5ad1b3" opacity="0.08"/>
      <!-- UR 事業×外向き = 混雑 -->
      <rect x="400" y="55" width="330" height="255" fill="#ff6b6b" opacity="0.06"/>
      <!-- LL 個人×内向き = 混雑 -->
      <rect x="70" y="310" width="330" height="255" fill="#ff6b6b" opacity="0.06"/>

      <!-- quadrant labels -->
      <text x="86" y="78" fill="#7ef0c7" font-size="12" font-weight="600">狙い目</text>
      <text x="86" y="96" fill="#9aa3b2" font-size="13">発信・創作・個人ブランド</text>
      <text x="714" y="78" fill="#ffb4b4" font-size="12" font-weight="600" text-anchor="end">混雑</text>
      <text x="714" y="96" fill="#9aa3b2" font-size="13" text-anchor="end">顧客価値・新規事業</text>
      <text x="86" y="548" fill="#ffb4b4" font-size="12" font-weight="600">混雑</text>
      <text x="86" y="530" fill="#9aa3b2" font-size="13">自分の生産性・能力拡張</text>
      <text x="714" y="548" fill="#7ef0c7" font-size="12" font-weight="600" text-anchor="end">狙い目</text>
      <text x="714" y="530" fill="#9aa3b2" font-size="13" text-anchor="end">社内DX・コスト改革</text>

      <!-- axes -->
      <line x1="60" y1="310" x2="740" y2="310" stroke="#cdd3de" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="400" y1="575" x2="400" y2="48" stroke="#cdd3de" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- axis labels -->
      <text x="56" y="300" fill="#e6e9ef" font-size="14" font-weight="600" text-anchor="end">個人</text>
      <text x="748" y="300" fill="#e6e9ef" font-size="14" font-weight="600">事業</text>
      <text x="400" y="40" fill="#e6e9ef" font-size="14" font-weight="600" text-anchor="middle">外向き</text>
      <text x="400" y="598" fill="#e6e9ef" font-size="14" font-weight="600" text-anchor="middle">内向き</text>
      <text x="746" y="328" fill="#9aa3b2" font-size="11">射程 →</text>

      <!-- points: real (filled) -->
      <g>
        <circle cx="185" cy="140" r="7" fill="#6ea8fe"/>
        <text x="199" y="144" fill="#e6e9ef" font-size="13">ブログ発信(note/hatena)</text>

        <circle cx="255" cy="205" r="7" fill="#6ea8fe"/>
        <text x="269" y="209" fill="#e6e9ef" font-size="13">music-factory</text>

        <circle cx="505" cy="155" r="7" fill="#6ea8fe"/>
        <text x="505" y="138" fill="#e6e9ef" font-size="13" text-anchor="middle">楽天ROOM収益化</text>

        <circle cx="205" cy="400" r="7" fill="#6ea8fe"/>
        <text x="219" y="404" fill="#e6e9ef" font-size="13">Wiki育成(使うほど育つ)</text>

        <circle cx="560" cy="420" r="7" fill="#6ea8fe"/>
        <text x="546" y="424" fill="#e6e9ef" font-size="13" text-anchor="end">SRE自律運用(homelab/ops)</text>
      </g>

      <!-- points: idea (hollow dashed) -->
      <g>
        <circle cx="632" cy="210" r="7" fill="none" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="618" y="214" fill="#9aa3b2" font-size="13" text-anchor="end">Human Harness</text>

        <circle cx="295" cy="470" r="7" fill="none" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="309" y="474" fill="#9aa3b2" font-size="13">interest-discover</text>

        <circle cx="640" cy="470" r="7" fill="none" stroke="#6ea8fe" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="626" y="474" fill="#9aa3b2" font-size="13" text-anchor="end">本業へのAI浸透</text>
      </g>
    </svg>

    <div class="legend">
      <span><span class="sw sw-real"></span>実働中</span>
      <span><span class="sw sw-idea"></span>構想・未着手</span>
      <span><span class="sw sw-sweet"></span>狙い目（逆対角）</span>
    </div>
  </div>

  <h2>読み方</h2>
  <p class="note">
    対角（左下＝個人×内向き／右上＝事業×外向き）はみんなが想像する<b style="color:#ffb4b4">混雑</b>ゾーン。<br>
    逆対角（左上＝個人×外向き／右下＝事業×内向き）が<b>狙い目</b>。<br>
    <b>ブログ発信</b>（左上）と <b>SRE自律運用</b>（右下）が、すでに2つの狙い目象限に置けている。手札の重心を狙い目側に寄せられるかが次の論点。
  </p>
  <p class="small">※点の位置は厳密な座標ではなく相対的な置き方。同じ取り組みでも深め方で象限内の位置は動く。</p>
</div>
</body>
</html>
