# Ontology: Object Types (Git-managed schema). Instances live in Neo4j.
version: 1
object_types:
  - type: Team
    description: 責任主体となる組織単位
    properties: [id, name, description]
  - type: Service
    description: 業務システムを構成するアプリケーション/サービス
    properties: [id, name, system, criticality, repository]
  - type: API
    description: Serviceが外部に提供する正規インターフェース
    properties: [id, name, method, path, version]
  - type: BusinessObject
    description: 業務上の概念（顧客、注文、請求など）
    properties: [id, name, description]
  - type: Database
    description: 物理データベース
    properties: [id, name, engine, environment]
  - type: Table
    description: 物理テーブル
    properties: [id, database, schema, name, columns]
  - type: Batch
    description: スケジュール実行されるバッチ処理
    properties: [id, name, schedule]
  - type: Unknown
    description: 観測はされたが正体が特定できていないObject。削除せず未解決の知識として保持する
    properties: [id, unknown_type, status, hint]
