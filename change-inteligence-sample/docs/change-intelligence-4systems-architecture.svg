<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic UI, Segoe UI, sans-serif" viewBox="0 0 1200 850" role="img" aria-label="Customer System / Order System / Billing System / Analytics System の 4 システム。各システムの中にアプリケーションがあり、その内側に提供 API とデータベースがある。Order と Billing は Customer API を呼び出す正規ルートを持つが、Billing と Analytics Daily Batch と正体不明の UNKNOWN-001 は API を素通りして customer-db のテーブルを直接参照している。">
        <rect width="1200" height="850" fill="#ffffff"/>
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a2233"/></marker>
          <marker id="arr-direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6321f"/></marker>
          <marker id="arr-unk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e4610e"/></marker>
          <marker id="arr-decl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a94a6"/></marker>
        </defs>

        <!-- ================= Customer System ================= -->
        <rect x="40" y="60" width="340" height="340" rx="12" fill="none" stroke="#1a2233" stroke-width="1.6"/>
        <text x="60" y="88" font-size="17" font-weight="700" fill="#1a2233">Customer System</text>
        <text x="60" y="102" font-size="10.5" fill="#5b6577">顧客マスタ管理 · 正規 API を提供する中心システム</text>
        <rect x="286" y="73" width="80" height="18" rx="9" fill="#7c5cd6"/>
        <text x="326" y="85.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Customer Team</text>
        <!-- service -->
        <rect x="56" y="112" width="308" height="272" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8"/>
        <text x="68" y="131" font-size="12.5" font-weight="700" fill="#2563eb">Customer App</text>
        <text x="180" y="131" font-size="10" fill="#5b6577">アプリケーション（API と DB を所有）</text>
        <!-- api -->
        <rect x="68" y="140" width="296" height="68" rx="8" fill="#0891b2" fill-opacity=".08" stroke="#0891b2" stroke-width="1.4"/>
        <text x="80" y="158" font-size="12" font-weight="700" fill="#0891b2">Customer API</text><text x="178" y="158" font-size="10" fill="#5b6577">提供する窓口</text>
        <text x="88" y="180" font-size="11" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#1a2233">GET /v1/customers/{id}</text><text x="252" y="180" font-size="10" fill="#5b6577">顧客取得</text>
        <text x="88" y="198" font-size="11" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#1a2233">PUT /v1/customers/{id}</text><text x="252" y="198" font-size="10" fill="#5b6577">顧客更新</text>
        <circle cx="364" cy="176" r="5.5" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
        <circle cx="364" cy="194" r="5.5" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
        <!-- db -->
        <rect x="68" y="218" width="296" height="152" rx="8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
        <text x="80" y="236" font-size="12" font-weight="700" fill="#6b7280">customer-db</text><text x="168" y="236" font-size="10" fill="#5b6577">PostgreSQL · このアプリだけが更新する</text>
        <rect x="80" y="246" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="88" y="258" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">customer_address</text>
        <text x="88" y="275" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">customer_id, postal_code, prefecture, city,</text>
        <text x="88" y="289" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">address1, address2</text>
        <rect x="80" y="302" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="88" y="314" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">customer</text>
        <text x="88" y="331" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">customer_id, name, email, phone, status,</text>
        <text x="88" y="345" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">created_at, updated_at</text>

        <!-- ================= Order System ================= -->
        <rect x="820" y="60" width="340" height="298" rx="12" fill="none" stroke="#1a2233" stroke-width="1.6"/>
        <text x="840" y="88" font-size="17" font-weight="700" fill="#1a2233">Order System</text>
        <text x="840" y="102" font-size="10.5" fill="#5b6577">注文管理 · Customer API を正規利用</text>
        <rect x="1078" y="73" width="68" height="18" rx="9" fill="#7c5cd6"/>
        <text x="1112" y="85.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Order Team</text>
        <rect x="836" y="112" width="308" height="230" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8"/>
        <text x="848" y="131" font-size="12.5" font-weight="700" fill="#2563eb">Order App</text>
        <rect x="848" y="140" width="296" height="50" rx="8" fill="#0891b2" fill-opacity=".08" stroke="#0891b2" stroke-width="1.4"/>
        <text x="860" y="158" font-size="12" font-weight="700" fill="#0891b2">Order API</text>
        <text x="868" y="180" font-size="11" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#1a2233">POST /v1/orders</text><text x="1000" y="180" font-size="10" fill="#5b6577">注文作成</text>
        <circle cx="1144" cy="176" r="5.5" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
        <rect x="848" y="200" width="296" height="128" rx="8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
        <text x="860" y="218" font-size="12" font-weight="700" fill="#6b7280">order-db</text><text x="928" y="218" font-size="10" fill="#5b6577">PostgreSQL</text>
        <rect x="860" y="228" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="868" y="240" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">order</text>
        <text x="868" y="257" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">order_id, customer_id, ordered_at,</text>
        <text x="868" y="271" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">total_amount, status</text>
        <rect x="860" y="284" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="868" y="296" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">order_item</text>
        <text x="868" y="313" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">order_item_id, order_id, sku, quantity, unit_price</text>

        <!-- ================= Billing System ================= -->
        <rect x="820" y="380" width="340" height="256" rx="12" fill="none" stroke="#1a2233" stroke-width="1.6"/>
        <text x="840" y="408" font-size="17" font-weight="700" fill="#1a2233">Billing System</text>
        <text x="840" y="422" font-size="10.5" fill="#5b6577">請求管理 · API 利用と DB 直接参照が混在</text>
        <rect x="1072" y="393" width="74" height="18" rx="9" fill="#7c5cd6"/>
        <text x="1109" y="405.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Billing Team</text>
        <rect x="836" y="432" width="308" height="188" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8"/>
        <text x="848" y="451" font-size="12.5" font-weight="700" fill="#2563eb">Billing App</text>
        <rect x="848" y="460" width="296" height="50" rx="8" fill="#0891b2" fill-opacity=".08" stroke="#0891b2" stroke-width="1.4"/>
        <text x="860" y="478" font-size="12" font-weight="700" fill="#0891b2">Billing API</text>
        <text x="868" y="500" font-size="11" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#1a2233">GET /v1/invoices/{id}</text><text x="1018" y="500" font-size="10" fill="#5b6577">請求書取得</text>
        <circle cx="1144" cy="496" r="5.5" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
        <rect x="848" y="520" width="296" height="86" rx="8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
        <text x="860" y="538" font-size="12" font-weight="700" fill="#6b7280">billing-db</text><text x="936" y="538" font-size="10" fill="#5b6577">PostgreSQL</text>
        <rect x="860" y="546" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="868" y="558" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">invoice</text>
        <text x="868" y="575" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">invoice_id, order_id, customer_id, amount,</text>
        <text x="868" y="589" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">issued_at, due_at, status</text>

        <!-- ================= Analytics System ================= -->
        <rect x="40" y="510" width="340" height="316" rx="12" fill="none" stroke="#1a2233" stroke-width="1.6"/>
        <text x="60" y="538" font-size="17" font-weight="700" fill="#1a2233">Analytics System</text>
        <text x="60" y="552" font-size="10.5" fill="#5b6577">分析・レポート · バッチ参照と正体不明の利用元を含む</text>
        <rect x="276" y="523" width="90" height="18" rx="9" fill="#7c5cd6"/>
        <text x="321" y="535.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Analytics Team</text>
        <!-- daily batch owns analytics-db -->
        <rect x="56" y="562" width="308" height="146" rx="10" fill="none" stroke="#c2418a" stroke-width="1.8"/>
        <text x="68" y="581" font-size="12.5" font-weight="700" fill="#c2418a">Analytics Daily Batch</text>
        <text x="68" y="594" font-size="9.5" fill="#5b6577">毎日 02:00 · customer を COPY して集計（API は提供しない）</text>
        <rect x="68" y="602" width="296" height="94" rx="8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
        <text x="80" y="620" font-size="12" font-weight="700" fill="#6b7280">analytics-db</text><text x="168" y="620" font-size="10" fill="#5b6577">BigQuery</text>
        <rect x="80" y="630" width="272" height="16" rx="3" fill="#b7791f" opacity=".18"/>
        <text x="88" y="642" font-size="11" font-weight="700" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#b7791f">customer_summary</text>
        <text x="88" y="659" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">customer_id, order_count, total_amount,</text>
        <text x="88" y="673" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">last_ordered_at</text>
        <!-- legacy batch -->
        <rect x="56" y="718" width="308" height="38" rx="8" fill="none" stroke="#c2418a" stroke-width="1.4" stroke-dasharray="4 3"/>
        <text x="68" y="736" font-size="12" font-weight="700" fill="#c2418a">Analytics Legacy Batch</text>
        <text x="68" y="749" font-size="9.5" fill="#5b6577">毎日 03:30 · 台帳に未登録 · 責任チーム未設定（Resolve の正解）</text>
        <!-- unknown -->
        <path d="M64 774 L76 766 L344 766 L356 774 L356 804 L344 812 L76 812 L64 804z" fill="none" stroke="#e4610e" stroke-width="1.8" stroke-dasharray="5 3"/>
        <text x="88" y="784" font-size="12" font-weight="700" fill="#e4610e">UNKNOWN-001</text><text x="186" y="784" font-size="9.5" fill="#5b6577">正体不明の利用元（未特定）</text>
        <text x="88" y="800" font-size="9.5" font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#5b6577">rpt_reader @10.20.3.14 · subnet=analytics-legacy · 03:30</text>

        <!-- ================= Cross-system dependencies ================= -->
        <!-- Order App -> Customer API GET (canonical) -->
        <line x1="836" y1="176" x2="376" y2="176" stroke="#1a2233" stroke-width="1.8" marker-end="url(#arr)"/>
        <text x="606" y="169" font-size="11" fill="#1a2233" text-anchor="middle">呼び出す（正規 · API 仕様書で申告 + ログで観測）</text>
        <!-- Order App -> Customer API PUT (declared only) -->
        <line x1="836" y1="194" x2="376" y2="194" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#arr-decl)"/>
        <text x="606" y="209" font-size="11" fill="#8a94a6" text-anchor="middle">申告のみ（ログに一度も観測なし → 使われていない申告）</text>
        <!-- Billing App -> Customer API GET (canonical, observed only) -->
        <polyline points="836,470 620,470 620,182 376,182" fill="none" stroke="#1a2233" stroke-width="1.8" marker-end="url(#arr)"/>
        <text x="612" y="262" font-size="11" fill="#1a2233" text-anchor="end">呼び出す（正規）</text>
        <text x="612" y="276" font-size="10" fill="#5b6577" text-anchor="end">ログで観測 · 申告なし</text>
        <!-- Billing App -> customer table (direct read, bypasses the API boundary) -->
        <polyline points="836,492 700,492 700,324 376,324" fill="none" stroke="#d6321f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arr-direct)"/>
        <text x="708" y="352" font-size="11" font-weight="700" fill="#d6321f">直接 READ</text>
        <text x="708" y="366" font-size="9.5" fill="#d6321f">API を素通りして DB へ</text>
        <text x="708" y="380" font-size="9.5" fill="#d6321f">請求書 PDF 用に SELECT</text>
        <!-- Analytics Daily Batch -> customer table (direct read, stale) -->
        <line x1="150" y1="562" x2="150" y2="372" stroke="#d6321f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arr-direct)"/>
        <text x="158" y="442" font-size="11" font-weight="700" fill="#d6321f">直接 READ（COPY）</text>
        <text x="158" y="456" font-size="10" fill="#d6321f">8/20 以降ログに現れない → 廃止候補</text>
        <!-- UNKNOWN-001 -> customer table (routed outside the Analytics box) -->
        <polyline points="356,789 400,789 400,340 376,340" fill="none" stroke="#e4610e" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arr-unk)"/>
        <text x="408" y="560" font-size="11" font-weight="700" fill="#e4610e">READ · 毎晩 03:30</text>
        <text x="408" y="574" font-size="10" fill="#e4610e">誰のものか分からない</text>

        <!-- callout -->
        <rect x="440" y="610" width="340" height="200" rx="10" fill="none" stroke="#aab4c4" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="458" y="636" font-size="12" font-weight="700" fill="#1a2233">この図から読み取れること</text>
        <text x="458" y="658" font-size="11" fill="#1a2233">・正規の入口は Customer API の 2 本だけ</text>
        <text x="458" y="678" font-size="11" fill="#d6321f">・API を素通りして customer-db に届く線が 3 本</text>
        <text x="458" y="698" font-size="11" fill="#1a2233">・うち 1 本は正体不明（UNKNOWN-001）</text>
        <text x="458" y="718" font-size="11" fill="#1a2233">・Legacy Batch は台帳に無く、責任チームも未設定</text>
        <text x="458" y="738" font-size="11" fill="#1a2233">・申告と観測がずれている線が 2 本</text>
        <text x="458" y="766" font-size="10.5" fill="#5b6577">customer テーブルを変更すると 4 チームに影響が及ぶが、</text>
        <text x="458" y="781" font-size="10.5" fill="#5b6577">「人に聞かないと分からない依存」が 3 本ある状態。</text>
      </svg>
