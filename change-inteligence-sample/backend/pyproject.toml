[project]
name = "change-intelligence-backend"
version = "0.1.0"
description = "Change Intelligence PoC backend: Knowledge Graph API over Neo4j"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "neo4j>=5.20,<6",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "anthropic>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
