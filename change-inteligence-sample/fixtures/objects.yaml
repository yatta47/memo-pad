# Instance fixtures. Replaces raw log collection for the PoC.
objects:
  # ---- Teams ----
  - id: team:customer
    type: Team
    name: Customer Team
    description: 顧客マスタと顧客APIの責任チーム
  - id: team:order
    type: Team
    name: Order Team
    description: 注文管理の責任チーム
  - id: team:billing
    type: Team
    name: Billing Team
    description: 請求管理の責任チーム
  - id: team:analytics
    type: Team
    name: Analytics Team
    description: 分析・レポートの責任チーム

  # ---- Services ----
  - id: service:customer
    type: Service
    name: Customer App
    system: Customer System
    criticality: HIGH
    repository: git@example.com:platform/customer-service.git
  - id: service:order
    type: Service
    name: Order App
    system: Order System
    criticality: HIGH
    repository: git@example.com:commerce/order-service.git
  - id: service:billing
    type: Service
    name: Billing App
    system: Billing System
    criticality: HIGH
    repository: git@example.com:finance/billing-service.git

  # ---- Batches ----
  - id: batch:analytics-daily
    type: Batch
    name: Analytics Daily Batch
    system: Analytics System
    schedule: "0 2 * * *"
  - id: batch:analytics-legacy
    type: Batch
    name: Analytics Legacy Batch
    system: Analytics System
    schedule: "30 3 * * *"
    description: 旧レポート基盤向けの抽出バッチ。台帳に未登録。

  # ---- APIs ----
  - id: api:customer-get
    type: API
    name: Get Customer
    method: GET
    path: /v1/customers/{id}
    version: v1
  - id: api:customer-update
    type: API
    name: Update Customer
    method: PUT
    path: /v1/customers/{id}
    version: v1
  - id: api:order-create
    type: API
    name: Create Order
    method: POST
    path: /v1/orders
    version: v1
  - id: api:billing-invoice-get
    type: API
    name: Get Invoice
    method: GET
    path: /v1/invoices/{id}
    version: v1

  # ---- Business Objects ----
  - id: bo:customer
    type: BusinessObject
    name: Customer
    description: 顧客。契約主体となる個人または法人
  - id: bo:address
    type: BusinessObject
    name: Address
    description: 顧客の住所。郵便番号、都道府県、市区町村、番地
  - id: bo:order
    type: BusinessObject
    name: Order
    description: 顧客が行った注文
  - id: bo:invoice
    type: BusinessObject
    name: Invoice
    description: 注文に対する請求

  # ---- Databases ----
  - id: db:customer
    type: Database
    name: customer-db
    engine: postgresql
    environment: production
  - id: db:order
    type: Database
    name: order-db
    engine: postgresql
    environment: production
  - id: db:billing
    type: Database
    name: billing-db
    engine: postgresql
    environment: production
  - id: db:analytics
    type: Database
    name: analytics-db
    engine: bigquery
    environment: production

  # ---- Tables ----
  - id: table:customer.customer
    type: Table
    database: db:customer
    schema: customer
    name: customer
    columns: [customer_id, name, email, phone, status, created_at, updated_at]
  - id: table:customer.customer_address
    type: Table
    database: db:customer
    schema: customer
    name: customer_address
    columns: [customer_id, postal_code, prefecture, city, address1, address2, updated_at]
  - id: table:order.order
    type: Table
    database: db:order
    schema: order
    name: order
    columns: [order_id, customer_id, ordered_at, total_amount, status]
  - id: table:order.order_item
    type: Table
    database: db:order
    schema: order
    name: order_item
    columns: [order_item_id, order_id, sku, quantity, unit_price]
  - id: table:billing.invoice
    type: Table
    database: db:billing
    schema: billing
    name: invoice
    columns: [invoice_id, order_id, customer_id, amount, issued_at, due_at, status]
  - id: table:analytics.customer_summary
    type: Table
    database: db:analytics
    schema: analytics
    name: customer_summary
    columns: [customer_id, order_count, total_amount, last_ordered_at]

  # ---- Unknown ----
  - id: unknown:UNKNOWN-001
    type: Unknown
    name: UNKNOWN-001
    unknown_type: consumer
    status: open
    hint: "DB ユーザー rpt_reader（10.20.3.0/24 のサーバー）が毎晩 03:30 に顧客テーブル customer.customer を読み取っている。管理者が分かっていない"
