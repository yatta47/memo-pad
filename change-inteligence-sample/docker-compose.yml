name: change-intelligence-poc

networks:
  change-intelligence:
    name: change-intelligence
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:

x-backend-env: &backend-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  ONTOLOGY_DIR: /data/ontology
  FIXTURES_DIR: /data/fixtures
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  neo4j:
    image: neo4j:5-community
    container_name: ci-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${BIND_HOST:-0.0.0.0}:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - change-intelligence
    healthcheck:
      # NEO4J_AUTH is "user/password"; strip the user prefix for cypher-shell.
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    image: change-intelligence-poc-backend:local
    build:
      context: ./backend
    container_name: ci-backend
    environment:
      <<: *backend-env
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./ontology:/data/ontology:ro
      - ./fixtures:/data/fixtures:ro
    networks:
      - change-intelligence
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; b=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); sys.exit(0 if b.get('status')=='ok' and b.get('neo4j')=='ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot seed job. Reuses the backend image (built by `docker compose up -d --build`).
  # Run with: docker compose run --rm seed   (reset + reseed: docker compose run --rm -e SEED_RESET=1 seed)
  seed:
    image: change-intelligence-poc-backend:local
    container_name: ci-seed
    profiles: ["init"]
    environment:
      <<: *backend-env
    volumes:
      - ./ontology:/data/ontology:ro
      - ./fixtures:/data/fixtures:ro
      - ./scripts:/app/scripts:ro
    networks:
      - change-intelligence
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["python", "scripts/seed.py"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    container_name: ci-frontend
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - change-intelligence
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
